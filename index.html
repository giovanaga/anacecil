<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ana Cecil ❤️</title>
    <!-- Fonte bonita estilo cinema para os créditos -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden;
            position: relative;
        }

        /* Animação dos Corações e Gatinhos de Fundo */
        .heart-bg, .cat-emoji-bg {
            position: absolute;
            animation: float 6s infinite linear;
            z-index: 1;
            user-select: none;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* Cartão Principal */
        .card {
            background: rgba(255, 255, 255, 0.88);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 420px;
            width: 90%;
            z-index: 10;
            position: relative;
            transition: opacity 1s ease-in-out;
        }

        /* Imagem Inicial Quadrada */
        .custom-img-inicial {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* Fotos do Sucesso: Quadradas e Giro Engraçado */
        .container-fotos-girando {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .img-giratoria {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* Efeito de Giro Engraçado */
        .foto1-animada {
            animation: giroEngracado1 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .foto2-animada {
            animation: giroEngracado2 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.2s forwards;
        }

        @keyframes giroEngracado1 {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(540deg); }
            70% { transform: scale(0.9) rotate(700deg); }
            100% { transform: scale(1) rotate(720deg) rotate(-6deg); opacity: 1; }
        }

        @keyframes giroEngracado2 {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(-540deg); }
            70% { transform: scale(0.9) rotate(-700deg); }
            100% { transform: scale(1) rotate(-720deg) rotate(6deg); opacity: 1; }
        }

        h1 {
            color: #d63384;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        #btn-sim {
            background-color: #ff4b2b;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
        }

        #btn-sim:hover {
            transform: scale(1.1);
            background-color: #ff416c;
        }

        #btn-nao {
            background-color: #6c757d;
            color: white;
            position: absolute;
            right: 20px;
            transition: all 0.15s ease-out;
        }

        .sucesso {
            display: none;
        }

        .sucesso h2 {
            color: #ff4b2b;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .sucesso p {
            font-size: 2rem;
            color: #333;
        }

        /* --- MODO CINEMA COM IMAGEM4 ESCURECIDA DE FUNDO --- */
        #cinema-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Usa a imagem4.jpg no fundo com um degradê/filtro escuro por cima */
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('imagem4.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #cinema-overlay.ativo {
            opacity: 1;
            pointer-events: auto;
        }

        /* Texto dos Créditos Finais */
        .creditos-texto {
            position: absolute;
            bottom: -150px;
            text-align: center;
            font-family: 'Great Vibes', cursive;
            color: #ffffff;
            font-size: 3.5rem;
            text-shadow: 0 0 15px rgba(255, 182, 193, 1), 0 0 30px rgba(255, 75, 43, 0.8);
            width: 90%;
            line-height: 1.3;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .creditos-texto.animar {
            animation: subirCreditos 8s linear forwards;
            opacity: 1;
        }

        @keyframes subirCreditos {
            0% {
                bottom: -150px;
            }
            100% {
                bottom: 45vh;
            }
        }
    </style>
</head>
<body>

    <!-- Overlay de Cinema (Com imagem4.jpg escurecida de fundo) -->
    <div id="cinema-overlay">
        <div class="creditos-texto" id="texto-creditos">
            Ana Cecil & Giovana<br>amor eterno ❤️
        </div>
    </div>

    <!-- Cartão com a Pergunta -->
    <div class="card" id="card-pergunta">
        <img class="custom-img-inicial" src="imagem1.jpg" alt="Foto 1">
        <h1>Para Ana Cecil 💕</h1>
        <p>Vamos voltar?</p>
        <div class="btn-group">
            <button id="btn-sim" onclick="aceitou()">Sim!</button>
            <button id="btn-nao" onmouseover="fugir()" onclick="fugir()" ontouchstart="fugir()">Não</button>
        </div>
    </div>

    <!-- Cartão de Sucesso -->
    <div class="card sucesso" id="card-sucesso">
        <div class="container-fotos-girando">
            <img class="img-giratoria foto1-animada" src="imagem2.jpg" alt="Foto 2">
            <img class="img-giratoria foto2-animada" src="imagem3.jpg" alt="Foto 3">
        </div>
        <h2>AMÉM!!!!!!! ❤️</h2>
        <p>🥰</p>
    </div>

    <script>
        const coracoes = ['❤️', '💖', '💕', '💗', '💓'];
        const gatinhos = ['🐱', '😸', '😻', '😽', '🐾', '🐈'];

        function criarCoracao() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = coracoes[Math.floor(Math.random() * coracoes.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.fontSize = Math.random() * 15 + 18 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 6000);
        }

        function criarGatoEmoji() {
            const cat = document.createElement('div');
            cat.classList.add('cat-emoji-bg');
            cat.innerHTML = gatinhos[Math.floor(Math.random() * gatinhos.length)];
            cat.style.left = Math.random() * 100 + 'vw';
            cat.style.animationDuration = Math.random() * 4 + 4 + 's';
            cat.style.fontSize = Math.random() * 15 + 22 + 'px';
            document.body.appendChild(cat);

            setTimeout(() => { cat.remove(); }, 6000);
        }

        setInterval(criarCoracao, 300);
        setInterval(criarGatoEmoji, 500);

        function fugir() {
            const btnNao = document.getElementById('btn-nao');
            const x = Math.random() * (window.innerWidth - btnNao.offsetWidth - 40);
            const y = Math.random() * (window.innerHeight - btnNao.offsetHeight - 40);

            btnNao.style.position = 'fixed';
            btnNao.style.left = x + 'px';
            btnNao.style.top = y + 'px';
        }

        function aceitou() {
            document.getElementById('card-pergunta').style.display = 'none';
            document.getElementById('card-sucesso').style.display = 'block';

            for (let i = 0; i < 35; i++) {
                setTimeout(criarCoracao, i * 30);
                setTimeout(criarGatoEmoji, i * 50);
            }

            // Faz o cartão sumir e a foto de fundo escurecida aparecer suavemente com os créditos
            setTimeout(() => {
                document.getElementById('card-sucesso').style.opacity = '0';
            }, 4000);

            setTimeout(() => {
                document.getElementById('cinema-overlay').classList.add('ativo');
            }, 5000);

            setTimeout(() => {
                document.getElementById('texto-creditos').classList.add('animar');
            }, 6000);
        }
    </script>
</body>
</html>
